<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A7A"/>
      <stop offset="100%" stop-color="#123A60"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>

  <!-- Globe (left) -->
  <g transform="translate(560,512)" fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <circle cx="0" cy="0" r="250"/>
    <!-- latitudes -->
    <line x1="-250" y1="0" x2="250" y2="0" stroke-width="3"/>
    <path d="M-242,-83 L242,-83" stroke-width="3" opacity="0.85"/>
    <path d="M-242,83 L242,83" stroke-width="3" opacity="0.85"/>
    <path d="M-205,-160 L205,-160" stroke-width="3" opacity="0.7"/>
    <path d="M-205,160 L205,160" stroke-width="3" opacity="0.7"/>
    <!-- longitudes -->
    <ellipse cx="0" cy="0" rx="250" ry="250"/>
    <ellipse cx="0" cy="0" rx="125" ry="250" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="0.5" ry="250" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="210" ry="250" opacity="0.5"/>
  </g>

  <!-- Flight path arc from globe to Europe pins -->
  <path d="M780,360 Q1060,180 1300,330" fill="none" stroke="white" stroke-width="3.5" stroke-dasharray="2 16" stroke-linecap="round" opacity="0.85"/>
  <circle cx="780" cy="360" r="8" fill="white"/>

  <!-- Location pins (three events), white outline -->
  <g fill="none" stroke="white" stroke-width="5" stroke-linejoin="round">
    <!-- pin 1 -->
    <g transform="translate(1230,300)">
      <path d="M0,0 C-34,0 -52,26 -52,52 C-52,90 0,150 0,150 C0,150 52,90 52,52 C52,26 34,0 0,0 Z"/>
      <circle cx="0" cy="52" r="20" fill="white" stroke="none"/>
    </g>
    <!-- pin 2 -->
    <g transform="translate(1420,470)">
      <path d="M0,0 C-30,0 -46,23 -46,46 C-46,80 0,132 0,132 C0,132 46,80 46,46 C46,23 30,0 0,0 Z"/>
      <circle cx="0" cy="46" r="18" fill="white" stroke="none"/>
    </g>
    <!-- pin 3 -->
    <g transform="translate(1250,560)">
      <path d="M0,0 C-26,0 -40,20 -40,40 C-40,70 0,116 0,116 C0,116 40,70 40,40 C40,20 26,0 0,0 Z"/>
      <circle cx="0" cy="40" r="16" fill="white" stroke="none"/>
    </g>
  </g>

  <!-- Small cell motif (bottom left, ties to cellular agriculture theme) -->
  <g transform="translate(150,820) scale(2.0)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" opacity="0.8">
    <circle cx="20" cy="20" r="18"/>
    <circle cx="20" cy="20" r="6" fill="white" opacity="0.7"/>
  </g>
  <g transform="translate(240,860) scale(1.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" opacity="0.7">
    <circle cx="20" cy="20" r="18"/>
    <circle cx="20" cy="20" r="6" fill="white" opacity="0.7"/>
  </g>
</svg>
