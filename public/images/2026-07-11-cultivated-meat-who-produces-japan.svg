<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C800"/>
      <stop offset="100%" stop-color="#E0B500"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>

  <!-- Bioreactor / tank (the technology, left) -->
  <g transform="translate(360,300) scale(3.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.4">
    <!-- Tank body -->
    <path d="M20,26 H80 V96 Q80,110 66,110 H34 Q20,110 20,96 Z"/>
    <!-- Liquid line -->
    <path d="M20,58 H80" opacity="0.85"/>
    <!-- Bubbles inside -->
    <circle cx="38" cy="80" r="4" fill="white" stroke="none" opacity="0.75"/>
    <circle cx="54" cy="92" r="3" fill="white" stroke="none" opacity="0.6"/>
    <circle cx="62" cy="74" r="3.5" fill="white" stroke="none" opacity="0.7"/>
    <!-- Top ports -->
    <path d="M38,26 V14 H46 V26"/>
    <path d="M62,26 V18"/>
    <circle cx="62" cy="14" r="4"/>
  </g>

  <!-- Arrow: technology handed off toward the producer -->
  <g transform="translate(720,560)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" opacity="0.9">
    <path d="M0,0 H150"/>
    <path d="M120,-26 L152,0 L120,26"/>
  </g>

  <!-- The missing producer: dashed factory outline with a question mark (right) -->
  <g transform="translate(1000,300) scale(3.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" stroke-dasharray="9 9" opacity="0.85">
    <!-- Factory roof/sawtooth -->
    <path d="M8,52 V108 H112 V40 L92,52 V32 L72,44 V26 L52,38 V52 Z"/>
    <!-- Chimney -->
    <path d="M96,40 V20 H108 V40"/>
    <!-- Door -->
    <path d="M50,108 V84 H70 V108"/>
  </g>
  <!-- Question mark inside the empty factory -->
  <g transform="translate(1000,300) scale(3.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.2">
    <path d="M22,70 Q22,58 33,58 Q44,58 44,68 Q44,76 35,80 Q30,82 30,90"/>
    <circle cx="30" cy="99" r="2.4" fill="white" stroke="none"/>
  </g>

  <!-- Small cell motif (bottom left, ties to cellular agriculture theme) -->
  <g transform="translate(240,824) scale(2.0)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" opacity="0.85">
    <circle cx="20" cy="20" r="18"/>
    <circle cx="20" cy="20" r="6" fill="white" opacity="0.7"/>
  </g>
  <g transform="translate(330,864) scale(1.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" opacity="0.75">
    <circle cx="20" cy="20" r="18"/>
    <circle cx="20" cy="20" r="6" fill="white" opacity="0.7"/>
  </g>
</svg>
