<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C800"/>
      <stop offset="100%" stop-color="#E0B500"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>

  <!-- Descending cost curve chart -->
  <g transform="translate(300,240)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Axes -->
    <path d="M40,40 L40,480 L900,480" stroke-width="6" opacity="0.85"/>

    <!-- Gridlines -->
    <g stroke-width="2" opacity="0.28">
      <line x1="40" y1="160" x2="900" y2="160"/>
      <line x1="40" y1="280" x2="900" y2="280"/>
      <line x1="40" y1="400" x2="900" y2="400"/>
    </g>

    <!-- Cost reduction curve: high (2026 ~40) descending toward target (~10) -->
    <path d="M110,90 C260,150 340,300 470,360 C600,420 720,438 850,440" stroke-width="9" opacity="0.95"/>

    <!-- Data points -->
    <circle cx="110" cy="90" r="12" fill="white" stroke="none"/>
    <circle cx="470" cy="360" r="10" fill="white" stroke="none" opacity="0.9"/>
    <circle cx="850" cy="440" r="14" fill="white" stroke="none"/>

    <!-- Target dashed line at 10 -->
    <line x1="40" y1="440" x2="900" y2="440" stroke-width="4" stroke-dasharray="16 14" opacity="0.75"/>
  </g>

  <!-- Start label ~40 EUR/kg -->
  <g transform="translate(360,268)" fill="white" opacity="0.95">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700">€40</text>
    <text x="0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="500" opacity="0.85">/kg</text>
  </g>

  <!-- Target label 10 EUR/kg -->
  <g transform="translate(1200,640)" fill="white">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="800">€10</text>
    <text x="6" y="80" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="600" opacity="0.9">/kg</text>
    <text x="0" y="150" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600" opacity="0.85">COST PARITY</text>
  </g>

  <!-- Downward arrow accent -->
  <g transform="translate(1150,340)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="10" opacity="0.92">
    <line x1="40" y1="0" x2="40" y2="150"/>
    <path d="M10,110 L40,150 L70,110"/>
  </g>
</svg>
