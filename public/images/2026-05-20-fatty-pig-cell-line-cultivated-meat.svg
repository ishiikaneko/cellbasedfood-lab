<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8D67A"/>
      <stop offset="100%" stop-color="#7BA838"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Pig head silhouette -->
  <g transform="translate(580,310) scale(3.2)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <!-- Face (round) -->
    <circle cx="50" cy="52" r="36"/>
    <!-- Left ear (upright triangle) -->
    <path d="M18,28 Q10,6 32,18"/>
    <!-- Right ear (upright triangle) -->
    <path d="M82,28 Q90,6 68,18"/>
    <!-- Snout (large round) -->
    <ellipse cx="50" cy="70" rx="17" ry="12"/>
    <!-- Nostrils -->
    <circle cx="43" cy="70" r="3" fill="white"/>
    <circle cx="57" cy="70" r="3" fill="white"/>
    <!-- Eyes -->
    <circle cx="34" cy="42" r="3" fill="white"/>
    <circle cx="66" cy="42" r="3" fill="white"/>
  </g>
  <!-- Fat droplets (right side) -->
  <g transform="translate(1060,340) scale(3.0)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Large droplet -->
    <path d="M30,8 C30,8 6,36 6,52 C6,67 17,78 30,78 C43,78 54,67 54,52 C54,36 30,8 30,8 Z" stroke-width="3.5"/>
    <ellipse cx="19" cy="58" rx="8" ry="5" fill="white" opacity="0.5" transform="rotate(-25 19 58)"/>
    <!-- Small droplet -->
    <path d="M72,28 C72,28 58,46 58,57 C58,65 64,72 72,72 C80,72 86,65 86,57 C86,46 72,28 72,28 Z" stroke-width="3"/>
    <ellipse cx="65" cy="62" rx="5" ry="3" fill="white" opacity="0.45" transform="rotate(-20 65 62)"/>
  </g>
</svg>
