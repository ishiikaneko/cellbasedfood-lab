<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89BB5"/>
      <stop offset="100%" stop-color="#D4789A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Erlenmeyer flask + egg side by side -->
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flask -->
    <g transform="translate(700,360) scale(3)" stroke-width="3.5">
      <path d="M40,14 L40,46 L19,76 Q14,88 26,88 L74,88 Q86,88 81,76 L60,46 L60,14 Z"/>
      <line x1="33" y1="14" x2="67" y2="14"/>
      <!-- Liquid bubbles inside -->
      <circle cx="40" cy="66" r="4" fill="white" opacity="0.75"/>
      <circle cx="55" cy="74" r="3" fill="white" opacity="0.75"/>
      <circle cx="46" cy="59" r="3" fill="white" opacity="0.6"/>
    </g>
    <!-- Plus sign -->
    <g transform="translate(1010,540)" stroke-width="4" opacity="0.85">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
    <!-- Egg -->
    <g transform="translate(1100,360) scale(3)" stroke-width="3.5">
      <ellipse cx="50" cy="56" rx="26" ry="34"/>
      <!-- Highlight -->
      <ellipse cx="42" cy="42" rx="6" ry="9" fill="white" opacity="0.5" stroke="none"/>
    </g>
  </g>
</svg>
