<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89C5C"/>
      <stop offset="100%" stop-color="#D87A35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Duck silhouette, slightly refined -->
  <g transform="translate(700,340) scale(3.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <!-- Body -->
    <ellipse cx="46" cy="60" rx="28" ry="17"/>
    <!-- Head -->
    <circle cx="70" cy="32" r="10"/>
    <!-- Neck -->
    <path d="M64,40 Q60,46 56,50"/>
    <!-- Beak -->
    <path d="M78,29 L92,31 L78,38 Z" fill="white"/>
    <!-- Eye -->
    <circle cx="72" cy="30" r="1.6" fill="white"/>
    <!-- Wing -->
    <path d="M34,54 Q46,46 60,52 Q56,62 44,64"/>
    <!-- Tail tip up -->
    <path d="M20,55 L12,47"/>
    <path d="M20,62 L11,60"/>
    <!-- Water ripple lines below -->
    <g opacity="0.6">
      <path d="M16,82 Q34,78 52,82" stroke-width="2.5"/>
      <path d="M28,90 Q46,86 64,90" stroke-width="2.5"/>
    </g>
  </g>
</svg>
