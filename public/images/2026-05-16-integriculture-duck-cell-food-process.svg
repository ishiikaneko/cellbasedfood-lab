<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="#0F6E56"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <g transform="translate(746,362) scale(3)">
    <!-- Duck body -->
    <ellipse cx="46" cy="60" rx="27" ry="17" fill="none" stroke="white" stroke-width="3.5"/>
    <!-- Duck head -->
    <circle cx="68" cy="34" r="9" fill="none" stroke="white" stroke-width="3.5"/>
    <!-- Neck -->
    <line x1="62" y1="42" x2="57" y2="47" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M75,31 L87,30 L75,38 Z" fill="white"/>
    <!-- Tail feathers -->
    <path d="M20,54 L11,43" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M20,61 L11,58" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
