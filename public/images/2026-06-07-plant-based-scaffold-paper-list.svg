<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A87FCC"/>
      <stop offset="100%" stop-color="#8A5BB5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Porous scaffold lattice with cells attached -->
  <g transform="translate(896,512)" stroke="white" fill="none">
    <!-- lattice frame -->
    <g stroke-width="6" opacity="0.85">
      <rect x="-300" y="-220" width="600" height="440" rx="24"/>
      <line x1="-100" y1="-220" x2="-100" y2="220"/>
      <line x1="100" y1="-220" x2="100" y2="220"/>
      <line x1="-300" y1="-73" x2="300" y2="-73"/>
      <line x1="-300" y1="73" x2="300" y2="73"/>
    </g>
    <!-- pores -->
    <g stroke-width="4" opacity="0.45">
      <circle cx="-200" cy="-146" r="40"/>
      <circle cx="0" cy="-146" r="40"/>
      <circle cx="200" cy="-146" r="40"/>
      <circle cx="-200" cy="0" r="40"/>
      <circle cx="0" cy="0" r="40"/>
      <circle cx="200" cy="0" r="40"/>
      <circle cx="-200" cy="146" r="40"/>
      <circle cx="0" cy="146" r="40"/>
      <circle cx="200" cy="146" r="40"/>
    </g>
  </g>
  <!-- adhered cells -->
  <g transform="translate(896,512)">
    <ellipse cx="-200" cy="-146" rx="22" ry="13" fill="url(#node)" transform="rotate(-25,-200,-146)"/>
    <ellipse cx="0" cy="0" rx="24" ry="14" fill="url(#node)" transform="rotate(18,0,0)"/>
    <ellipse cx="200" cy="146" rx="22" ry="13" fill="url(#node)" transform="rotate(-15,200,146)"/>
    <ellipse cx="200" cy="-146" rx="20" ry="12" fill="url(#node)" transform="rotate(35,200,-146)"/>
    <ellipse cx="-200" cy="146" rx="20" ry="12" fill="url(#node)" transform="rotate(-40,-200,146)"/>
  </g>
</svg>
