<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C800"/>
      <stop offset="100%" stop-color="#E0B500"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Megaphone announcement icon -->
  <g transform="translate(700,360) scale(3)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <!-- Megaphone body -->
    <path d="M18,38 L18,62 L34,62 L62,80 L62,20 L34,38 Z"/>
    <!-- Handle / mouthpiece highlight -->
    <rect x="18" y="38" width="16" height="24" rx="2" fill="white" opacity="0.85"/>
    <!-- Sound waves -->
    <path d="M70,35 Q80,50 70,65" stroke-linecap="round"/>
    <path d="M74,28 Q88,50 74,72" stroke-linecap="round" stroke-width="3" opacity="0.6"/>
    <path d="M78,21 Q96,50 78,79" stroke-linecap="round" stroke-width="2.8" opacity="0.35"/>
  </g>
</svg>
