<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DA0E6"/>
      <stop offset="100%" stop-color="#2A65B8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dish" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>

  <!-- 4 petri dishes in a 2x2 grid, each showing a different company's cell -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Dish ① top-left: duck primary cell on edible scaffold (3D) ===== -->
    <g>
      <circle cx="560" cy="368" r="220" fill="url(#dish)" stroke-width="7"/>
      <circle cx="560" cy="368" r="200" stroke-width="2" opacity="0.35" fill="none"/>
      <!-- scaffold mesh -->
      <g stroke="white" stroke-width="4" opacity="0.45" fill="none">
        <line x1="430" y1="318" x2="690" y2="318"/>
        <line x1="430" y1="378" x2="690" y2="378"/>
        <line x1="430" y1="438" x2="690" y2="438"/>
        <line x1="470" y1="270" x2="470" y2="470"/>
        <line x1="560" y1="250" x2="560" y2="486"/>
        <line x1="650" y1="270" x2="650" y2="470"/>
      </g>
      <!-- cells sitting on scaffold -->
      <g fill="white" stroke="none">
        <circle cx="470" cy="318" r="20" opacity="0.9"/>
        <circle cx="560" cy="318" r="22" opacity="0.9"/>
        <circle cx="650" cy="378" r="20" opacity="0.9"/>
        <circle cx="470" cy="438" r="19" opacity="0.85"/>
        <circle cx="650" cy="318" r="18" opacity="0.85"/>
      </g>
      <g fill="#1F5BAA" stroke="none" opacity="0.55">
        <circle cx="470" cy="318" r="8"/>
        <circle cx="560" cy="318" r="9"/>
        <circle cx="650" cy="378" r="8"/>
      </g>
    </g>

    <!-- ===== Dish ② top-right: chicken primary cell, planar (elongated) ===== -->
    <g>
      <circle cx="1232" cy="368" r="220" fill="url(#dish)" stroke-width="7"/>
      <circle cx="1232" cy="368" r="200" stroke-width="2" opacity="0.35" fill="none"/>
      <!-- flat monolayer of spindle-shaped cells -->
      <g fill="white" stroke="none" opacity="0.9">
        <ellipse cx="1130" cy="320" rx="62" ry="20" transform="rotate(-12 1130 320)"/>
        <ellipse cx="1300" cy="332" rx="62" ry="20" transform="rotate(8 1300 332)"/>
        <ellipse cx="1170" cy="392" rx="62" ry="20" transform="rotate(6 1170 392)"/>
        <ellipse cx="1320" cy="408" rx="62" ry="20" transform="rotate(-10 1320 408)"/>
        <ellipse cx="1240" cy="456" rx="62" ry="20" transform="rotate(4 1240 456)"/>
      </g>
      <g fill="#1F5BAA" stroke="none" opacity="0.55">
        <circle cx="1130" cy="320" r="9"/>
        <circle cx="1300" cy="332" r="9"/>
        <circle cx="1170" cy="392" r="9"/>
        <circle cx="1320" cy="408" r="9"/>
        <circle cx="1240" cy="456" r="9"/>
      </g>
    </g>

    <!-- ===== Dish ③ bottom-left: bovine muscle cell line, suspension + gene (DNA) ===== -->
    <g>
      <circle cx="560" cy="690" r="220" fill="url(#dish)" stroke-width="7"/>
      <circle cx="560" cy="690" r="200" stroke-width="2" opacity="0.35" fill="none"/>
      <!-- floating round cells -->
      <g fill="white" stroke="none">
        <circle cx="470" cy="630" r="24" opacity="0.9"/>
        <circle cx="600" cy="640" r="26" opacity="0.9"/>
        <circle cx="520" cy="730" r="24" opacity="0.85"/>
        <circle cx="640" cy="740" r="22" opacity="0.85"/>
        <circle cx="450" cy="730" r="18" opacity="0.8"/>
      </g>
      <g fill="#1F5BAA" stroke="none" opacity="0.5">
        <circle cx="470" cy="630" r="9"/>
        <circle cx="600" cy="640" r="10"/>
        <circle cx="520" cy="730" r="9"/>
      </g>
      <!-- DNA double helix marker = gene-introduced cell line -->
      <g stroke="white" stroke-width="5" fill="none" opacity="0.85" transform="translate(660 620)">
        <path d="M0,0 Q24,18 0,36 Q-24,54 0,72 Q24,90 0,108"/>
        <path d="M24,0 Q0,18 24,36 Q48,54 24,72 Q0,90 24,108"/>
        <line x1="3" y1="12" x2="21" y2="12" stroke-width="3"/>
        <line x1="3" y1="36" x2="21" y2="36" stroke-width="3"/>
        <line x1="3" y1="60" x2="21" y2="60" stroke-width="3"/>
        <line x1="3" y1="84" x2="21" y2="84" stroke-width="3"/>
      </g>
    </g>

    <!-- ===== Dish ④ bottom-right: bovine pluripotent stem cell colony (sphere) ===== -->
    <g>
      <circle cx="1232" cy="690" r="220" fill="url(#dish)" stroke-width="7"/>
      <circle cx="1232" cy="690" r="200" stroke-width="2" opacity="0.35" fill="none"/>
      <!-- dense spherical colony -->
      <circle cx="1232" cy="690" r="120" fill="white" opacity="0.12" stroke-width="4"/>
      <g fill="white" stroke="none" opacity="0.92">
        <circle cx="1232" cy="690" r="30"/>
        <circle cx="1170" cy="650" r="26"/>
        <circle cx="1296" cy="650" r="26"/>
        <circle cx="1170" cy="730" r="26"/>
        <circle cx="1296" cy="730" r="26"/>
        <circle cx="1232" cy="618" r="22"/>
        <circle cx="1232" cy="762" r="22"/>
        <circle cx="1120" cy="690" r="20"/>
        <circle cx="1344" cy="690" r="20"/>
      </g>
      <g fill="#1F5BAA" stroke="none" opacity="0.5">
        <circle cx="1232" cy="690" r="11"/>
        <circle cx="1170" cy="650" r="9"/>
        <circle cx="1296" cy="650" r="9"/>
        <circle cx="1170" cy="730" r="9"/>
        <circle cx="1296" cy="730" r="9"/>
      </g>
    </g>
  </g>

  <!-- numbered badges for the 4 cases -->
  <g font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-weight="700">
    <circle cx="392" cy="200" r="36" fill="white"/>
    <text x="392" y="215" font-size="42" fill="#1F5BAA" text-anchor="middle">1</text>
    <circle cx="1400" cy="200" r="36" fill="white"/>
    <text x="1400" y="215" font-size="42" fill="#1F5BAA" text-anchor="middle">2</text>
    <circle cx="392" cy="858" r="36" fill="white"/>
    <text x="392" y="873" font-size="42" fill="#1F5BAA" text-anchor="middle">3</text>
    <circle cx="1400" cy="858" r="36" fill="white"/>
    <text x="1400" y="873" font-size="42" fill="#1F5BAA" text-anchor="middle">4</text>
  </g>

  <!-- center connecting magnifier hint linking the 4 dishes -->
  <g fill="none" stroke="white" stroke-linecap="round" opacity="0.55">
    <circle cx="896" cy="512" r="70" stroke-width="10"/>
    <circle cx="896" cy="512" r="56" stroke-width="2" opacity="0.6"/>
    <path d="M820,452 Q834,420 872,418" stroke-width="5" opacity="0.7"/>
    <line x1="946" y1="562" x2="1004" y2="620" stroke-width="14"/>
  </g>
</svg>
