<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A87FCC"/>
      <stop offset="100%" stop-color="#8A5BB5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bead" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Microcarrier bead cluster -->
  <g transform="translate(896,512)">
    <!-- Large back beads -->
    <circle cx="-180" cy="-40" r="62" fill="url(#bead)" opacity="0.55"/>
    <circle cx="160" cy="-80" r="58" fill="url(#bead)" opacity="0.55"/>
    <circle cx="40" cy="160" r="64" fill="url(#bead)" opacity="0.55"/>
    <circle cx="-130" cy="120" r="50" fill="url(#bead)" opacity="0.55"/>
    <circle cx="190" cy="80" r="46" fill="url(#bead)" opacity="0.55"/>
    <!-- Foreground beads with cells attached -->
    <g>
      <circle cx="-80" cy="-100" r="80" fill="url(#bead)"/>
      <!-- attached cells -->
      <ellipse cx="-130" cy="-150" rx="14" ry="9" fill="none" stroke="white" stroke-width="3" transform="rotate(-30,-130,-150)"/>
      <ellipse cx="-30" cy="-160" rx="12" ry="8" fill="none" stroke="white" stroke-width="3" transform="rotate(20,-30,-160)"/>
      <ellipse cx="-140" cy="-50" rx="13" ry="8" fill="none" stroke="white" stroke-width="3" transform="rotate(60,-140,-50)"/>
    </g>
    <g>
      <circle cx="100" cy="40" r="86" fill="url(#bead)"/>
      <ellipse cx="160" cy="-20" rx="13" ry="9" fill="none" stroke="white" stroke-width="3" transform="rotate(-40,160,-20)"/>
      <ellipse cx="180" cy="50" rx="14" ry="9" fill="none" stroke="white" stroke-width="3" transform="rotate(30,180,50)"/>
      <ellipse cx="50" cy="120" rx="12" ry="8" fill="none" stroke="white" stroke-width="3" transform="rotate(-60,50,120)"/>
    </g>
  </g>
</svg>
