<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8D67A"/>
      <stop offset="100%" stop-color="#7BA838"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="18%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1792" height="1024" fill="url(#bg)"/>
  <rect width="1792" height="1024" fill="url(#sheen)"/>
  <rect width="1792" height="1024" fill="url(#glow)"/>
  <!-- Fish silhouette (left) -->
  <g transform="translate(430,360) scale(3.4)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2">
    <!-- Body -->
    <path d="M0,45 C40,-2 130,-2 168,45 C130,92 40,92 0,45 Z"/>
    <!-- Tail -->
    <path d="M168,45 C188,22 206,16 214,10 C210,30 210,60 214,80 C206,74 188,68 168,45 Z"/>
    <!-- Gill -->
    <path d="M42,14 C30,45 30,45 42,76"/>
    <!-- Eye -->
    <circle cx="30" cy="38" r="6.5"/>
    <circle cx="30" cy="38" r="2.6" fill="white" stroke="none"/>
    <!-- Top fin -->
    <path d="M80,4 C96,-16 118,-16 130,2"/>
    <!-- Bottom fin -->
    <path d="M80,86 C96,106 118,106 130,88"/>
  </g>
  <!-- Suspension cells (right side) -->
  <g transform="translate(1140,340) scale(3.0)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2">
    <circle cx="24" cy="22" r="20"/>
    <circle cx="24" cy="22" r="8" fill="white" opacity="0.55" stroke="none"/>
    <circle cx="66" cy="52" r="14"/>
    <circle cx="66" cy="52" r="5.5" fill="white" opacity="0.5" stroke="none"/>
    <circle cx="20" cy="68" r="11"/>
    <circle cx="20" cy="68" r="4.5" fill="white" opacity="0.5" stroke="none"/>
    <circle cx="70" cy="12" r="8"/>
    <circle cx="70" cy="12" r="3.2" fill="white" opacity="0.5" stroke="none"/>
  </g>
</svg>
