name: Auto Publish Article
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 記事トピック
        required: false
        default: ''
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
        working-directory: ./content-os
      - name: Env
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > content-os/.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> content-os/.env
      - name: Git config
        run: |
          git config user.name "Bot"
          git config user.email "bot@example.com"
      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: node content-os/src/index.js publish
