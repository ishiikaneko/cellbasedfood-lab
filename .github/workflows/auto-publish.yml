name: Auto Publish Article
on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 09:00 JST
  workflow_dispatch:
    inputs:
      topic:
        description: 記事トピック（空欄でデフォルト）
        required: false
        default: ''
      batch_count:
        description: 生成記事数（初回10本一括生成などに使用）
        required: false
        default: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install content-os dependencies
        run: npm install
        working-directory: ./content-os
      - name: Configure Git
        run: |
          git config user.name "Bot"
          git config user.email "bot@example.com"
      - name: Generate and publish article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_REPO_PATH: ${{ github.workspace }}
          TOPIC: ${{ github.event.inputs.topic }}
          BATCH_COUNT: ${{ github.event.inputs.batch_count || '1' }}
        run: node content-os/src/index.js publish

  post-to-x:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install content-os dependencies
        run: npm install
        working-directory: ./content-os
      - name: Configure Git
        run: |
          git config user.name "Bot"
          git config user.email "bot@example.com"
      - name: Post to X（36h 経過時のみ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          SITE_REPO_PATH: ${{ github.workspace }}
          SITE_URL: https://cellbasedfood-lab.com
        run: node content-os/src/x-auto-post.js
